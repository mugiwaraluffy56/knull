name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: knull
          POSTGRES_PASSWORD: knull
          POSTGRES_DB: knull
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knull -d knull"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        working-directory: backend
        run: test -z "$(gofmt -l .)" || (gofmt -l . && echo 'run gofmt' && exit 1)
      - name: go vet
        working-directory: backend
        run: go vet ./...
      - name: go build
        working-directory: backend
        run: go build ./...
      - name: Start Keycloak with the Knull realm
        run: |
          docker run -d --name keycloak -p 8081:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -e KC_HTTP_ENABLED=true -e KC_HOSTNAME_STRICT=false \
            -v "${{ github.workspace }}/infra/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.0 start-dev --import-realm --http-port=8080
          echo "waiting for keycloak realm discovery..."
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/realms/knull/.well-known/openid-configuration || true)
            if [ "$code" = "200" ]; then echo "keycloak ready"; break; fi
            sleep 3
          done
      - name: Apply migrations
        working-directory: backend
        env:
          KNULL_DATABASE_URL: postgres://knull:knull@localhost:5432/knull?sslmode=disable
          KNULL_REDIS_URL: redis://localhost:6379/0
        run: go run ./cmd/migrate
      - name: go test
        working-directory: backend
        env:
          KNULL_DATABASE_URL: postgres://knull:knull@localhost:5432/knull?sslmode=disable
          KNULL_REDIS_URL: redis://localhost:6379/0
          KNULL_TEST_DATABASE_URL: postgres://knull:knull@localhost:5432/knull?sslmode=disable
          KNULL_TEST_OIDC_ISSUER: http://localhost:8081/realms/knull
        run: go test ./...

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Generate API client
        working-directory: web
        run: pnpm gen:api
      - name: Verify generated client is in sync
        run: git diff --exit-code web/lib/generated/api.ts
      - name: Typecheck
        working-directory: web
        run: pnpm typecheck
      - name: Lint
        working-directory: web
        run: pnpm lint
      - name: Build
        working-directory: web
        run: pnpm build
