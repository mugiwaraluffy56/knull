services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: knull
      POSTGRES_PASSWORD: knull
      POSTGRES_DB: knull
    ports:
      - "55432:5432"
    volumes:
      - knull_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knull -d knull"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  knull_pgdata:
