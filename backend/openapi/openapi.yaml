openapi: 3.1.0
info:
  title: Knull Incident API
  version: 0.1.0
  description: >
    HTTP contract for the Knull incident API. This foundation slice defines the
    health endpoints; incident, service, and approval operations are added by
    later implementation tasks. The TypeScript client types are generated from
    this document.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /healthz:
    get:
      operationId: getLiveness
      summary: Liveness probe
      description: Reports that the process is running. Does not check dependencies.
      responses:
        "200":
          description: Process is live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: >
        Checks every backing dependency. Returns 200 when all are reachable and
        503 with per-dependency detail otherwise.
      responses:
        "200":
          description: All dependencies reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: One or more dependencies unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /api/auth/login:
    get:
      operationId: login
      summary: Begin operator sign-in
      description: Redirects the browser to the configured OIDC provider.
      responses:
        "302":
          description: Redirect to the identity provider.
  /api/auth/logout:
    post:
      operationId: logout
      summary: Sign out
      description: Revokes the current session and clears the cookie.
      responses:
        "204":
          description: Signed out.
  /api/me:
    get:
      operationId: getMe
      summary: Current operator identity
      responses:
        "200":
          description: The signed-in operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operator"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/integrations/credentials:
    get:
      operationId: listCredentials
      summary: List integration credential metadata
      description: Returns metadata only; secret values are never included.
      responses:
        "200":
          description: Stored credential metadata.
          content:
            application/json:
              schema:
                type: object
                required: [credentials]
                properties:
                  credentials:
                    type: array
                    items:
                      $ref: "#/components/schemas/CredentialMetadata"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: putCredential
      summary: Store or replace an integration credential
      description: >
        Accepts a write-only secret value, encrypts it at rest, and returns
        metadata only. The value is never returned by any endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutCredentialRequest"
      responses:
        "200":
          description: Stored credential metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialMetadata"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/services:
    get:
      operationId: listServices
      summary: List configured services
      responses:
        "200":
          description: All configured services.
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items:
                      $ref: "#/components/schemas/Service"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createService
      summary: Create a service mapping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: Created service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "409":
          description: Duplicate key in this environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/services/{id}:
    get:
      operationId: getService
      summary: Get a service
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200":
          description: The service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "404":
          description: Not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: updateService
      summary: Update a service mapping
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "200":
          description: Updated service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "409":
          description: Duplicate key in this environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/services/{id}/enabled:
    patch:
      operationId: setServiceEnabled
      summary: Enable or disable a service
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: Updated service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "404":
          description: Not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/alerts/webhook:
    post:
      operationId: alertWebhook
      summary: Prometheus Alertmanager webhook
      description: >
        Receives Alertmanager notifications. Authenticated by a shared secret
        (Bearer token or `token` query param), not an operator session.
        Unauthorized or malformed deliveries are recorded and rejected.
      responses:
        "202":
          description: Delivery processed; per-alert outcomes returned.
        "400":
          description: Malformed payload.
        "401":
          description: Invalid or missing secret.
  /api/fleet:
    get:
      operationId: getFleet
      summary: Fleet health and active incidents
      responses:
        "200":
          description: Fleet rows, services with active incidents first.
          content:
            application/json:
              schema:
                type: object
                required: [fleet]
                properties:
                  fleet:
                    type: array
                    items:
                      $ref: "#/components/schemas/FleetRow"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/incidents:
    get:
      operationId: listIncidents
      summary: List incidents
      responses:
        "200":
          description: Incidents, most recently updated first.
          content:
            application/json:
              schema:
                type: object
                required: [incidents]
                properties:
                  incidents:
                    type: array
                    items:
                      $ref: "#/components/schemas/Incident"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: startInvestigation
      summary: Start an operator-initiated investigation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceId, summary]
              properties:
                serviceId:
                  type: string
                  format: uuid
                summary:
                  type: string
                symptoms:
                  type: object
                  additionalProperties:
                    type: string
                force:
                  type: boolean
      responses:
        "201":
          description: Incident opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "400":
          description: Invalid request or unknown service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: An active investigation already exists for this service.
  /api/incidents/{id}:
    get:
      operationId: getIncident
      summary: Get an incident
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: The incident.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "404":
          description: Not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/incidents/{id}/collect:
    post:
      operationId: collectEvidence
      summary: Run read-only investigation for an incident
      description: >
        Runs the connected read-only investigators and records evidence. When
        Jev is configured, classifies incident causes from available evidence,
        records ranked hypotheses, and escalates uncertain results.
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "202":
          description: Evidence collected.
        "400":
          description: Incident has no service mapping.
        "404":
          description: Incident not found.
        "503":
          description: No investigation integrations connected.
        "502":
          description: Evidence collected, but Jev classification failed.
  /api/incidents/{id}/events:
    get:
      operationId: listIncidentEvents
      summary: Get an incident's audit history
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: Ordered audit events.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/IncidentEvent"
        "404":
          description: Not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/incidents/{id}/plans:
    post:
      operationId: createActionPlan
      summary: Record a bounded remediation proposal
      description: Seals a versioned action scoped to the incident service mapping and stored evidence. Does not execute it.
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionDraft"
      responses:
        "201":
          description: Sealed action proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedActionPlan"
        "400":
          description: Invalid action or scope.
        "401":
          description: Authentication required.
        "404":
          description: Incident not found.
        "503":
          description: Action planning unavailable.
  /api/incidents/{id}/sandbox-runs:
    post:
      operationId: prepareSandboxRun
      summary: Prepare and clean up a dedicated-cluster sandbox run
      description: Creates a restricted run namespace for a sealed action and records its provenance. Prepared does not mean validation passed.
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actionEventId, workload]
              properties:
                actionEventId: { type: string, format: uuid }
                workload:
                  $ref: "#/components/schemas/SandboxWorkload"
      responses:
        "202":
          description: Run prepared and cleanup verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxRecordedRun"
        "400":
          description: Invalid request.
        "401":
          description: Authentication required.
        "404":
          description: Incident not found.
        "422":
          description: Sandbox isolation, execution, or cleanup failed.
        "503":
          description: Dedicated sandbox cluster not configured.
  /api/incidents/{id}/validations/memory:
    post:
      operationId: validateMemory
      summary: Reproduce a 256Mi OOM and validate a 1Gi candidate
      description: Runs two isolated sandbox namespaces, requires a TrueForge executed script and independent Kubernetes and Prometheus observations, verifies cleanup, then records the result. Failed or missing evidence cannot advance to approval.
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actionEventId, workload]
              properties:
                actionEventId: { type: string, format: uuid }
                workload: { $ref: "#/components/schemas/SandboxWorkload" }
      responses:
        "200":
          description: Baseline failure reproduced and candidate passed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryValidationResult" }
        "400": { description: Invalid request. }
        "401": { description: Authentication required. }
        "404": { description: Incident not found. }
        "422":
          description: Validation failed; response includes result and error.
          content:
            application/json:
              schema:
                type: object
                required: [error, result]
                properties:
                  error: { type: string }
                  result: { $ref: "#/components/schemas/MemoryValidationResult" }
        "503": { description: Validation dependencies not configured. }
  /api/incidents/{id}/approvals:
    post:
      operationId: approveAction
      summary: Approve one validated action for 15 minutes
      description: Records the signed-in operator and exact sealed action digest. Production remains unchanged until the backend execution gate checks the live precondition.
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionDecisionRequest"
      responses:
        "201":
          description: Action-specific approval recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionDecision"
        "400": { description: Invalid request. }
        "401": { description: Authentication required. }
        "404": { description: Incident not found. }
        "409": { description: Action was not eligible or was already decided. }
        "503": { description: Approval service unavailable. }
  /api/incidents/{id}/denials:
    post:
      operationId: denyAction
      summary: Deny one validated action
      description: Records the signed-in operator and optional reason, then atomically moves the incident to DENIED.
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionDecisionRequest"
      responses:
        "201":
          description: Action-specific denial recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionDecision"
        "400": { description: Invalid request. }
        "401": { description: Authentication required. }
        "404": { description: Incident not found. }
        "409": { description: Action was not eligible or was already decided. }
        "503": { description: Approval service unavailable. }
components:
  parameters:
    ServiceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IncidentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ActionDecisionRequest:
      type: object
      required: [actionEventId, actionDigest]
      properties:
        actionEventId: { type: string, format: uuid }
        actionDigest: { type: string }
        reason: { type: string, maxLength: 500 }
    ActionDecision:
      type: object
      required: [id, incidentId, actionEventId, actionDigest, decision, operatorId, operatorEmail, decidedAt]
      properties:
        id: { type: string, format: uuid }
        incidentId: { type: string, format: uuid }
        actionEventId: { type: string, format: uuid }
        actionDigest: { type: string }
        decision: { type: string, enum: [APPROVED, DENIED] }
        operatorId: { type: string, format: uuid }
        operatorEmail: { type: string }
        reason: { type: string }
        decidedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        invalidatedAt: { type: string, format: date-time }
    SandboxWorkload:
      type: object
      required: [imageDigest, container, replicas, cpu, memory]
      properties:
        imageDigest: { type: string }
        container: { type: string }
        replicas: { type: integer }
        cpu: { type: string }
        memory: { type: string }
    SandboxRun:
      type: object
      required: [id, namespace, clusterUid, actionDigest, actionVersion, workload, limitations, environmentDifferences, startedAt, finishedAt, cleanupVerified, status]
      properties:
        id: { type: string, format: uuid }
        namespace: { type: string }
        clusterUid: { type: string }
        actionDigest: { type: string }
        actionVersion: { type: string }
        workload: { $ref: "#/components/schemas/SandboxWorkload" }
        limitations:
          type: array
          items: { type: string }
        environmentDifferences:
          type: array
          items: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        cleanupVerified: { type: boolean }
        status: { type: string, enum: [prepared, checked, failed] }
        error: { type: string }
    SandboxRecordedRun:
      type: object
      required: [eventId, run]
      properties:
        eventId: { type: string, format: uuid }
        run: { $ref: "#/components/schemas/SandboxRun" }
    MemoryValidationEvidence:
      type: object
      required: [script, pods, metrics]
      properties:
        script:
          type: object
          required: [artifactRef, exitCode, output]
          properties:
            artifactRef: { type: string }
            sessionId: { type: string }
            turnId: { type: string }
            sandboxId: { type: string }
            executionId: { type: string }
            exitCode: { type: integer }
            output: { type: string }
        pods:
          type: object
          required: [desired, healthy, oomKills, observedAt]
          properties:
            desired: { type: integer }
            healthy: { type: integer }
            oomKills: { type: integer }
            observedAt: { type: string, format: date-time }
        metrics:
          type: object
          required: [errorRate, p95Milliseconds, samples, windowStart, windowEnd]
          properties:
            errorRate: { type: number }
            p95Milliseconds: { type: number }
            samples: { type: integer }
            windowStart: { type: string, format: date-time }
            windowEnd: { type: string, format: date-time }
    MemoryValidationResult:
      type: object
      required: [actionEventId, actionDigest, baseline, candidate, baselineEvidence, candidateEvidence, passed]
      properties:
        actionEventId: { type: string, format: uuid }
        actionDigest: { type: string }
        baseline: { $ref: "#/components/schemas/SandboxRun" }
        candidate: { $ref: "#/components/schemas/SandboxRun" }
        baselineEvidence: { $ref: "#/components/schemas/MemoryValidationEvidence" }
        candidateEvidence: { $ref: "#/components/schemas/MemoryValidationEvidence" }
        passed: { type: boolean }
        failure: { type: string }
    ActionTarget:
      type: object
      required: [cluster, namespace, kind, name]
      properties:
        cluster: { type: string }
        namespace: { type: string }
        kind: { type: string, enum: [Deployment] }
        name: { type: string }
        container: { type: string }
    ActionPreconditions:
      type: object
      required: [resourceUid, resourceVersion, currentValue]
      properties:
        resourceUid: { type: string, format: uuid }
        resourceVersion: { type: string }
        currentValue: { type: string }
    ActionDraft:
      type: object
      required: [type, environment, target, field, currentValue, desiredValue, preconditions, expectedImpact, risk, evidenceIds]
      properties:
        type:
          type: string
          enum: [RESTART_WORKLOAD, SCALE_REPLICAS, ADJUST_CPU, ADJUST_MEMORY, ROLLBACK_DEPLOYMENT]
        environment: { type: string }
        target: { $ref: "#/components/schemas/ActionTarget" }
        field: { type: string }
        currentValue: { type: string }
        desiredValue: { type: string }
        preconditions: { $ref: "#/components/schemas/ActionPreconditions" }
        expectedImpact: { type: string }
        risk: { type: string, enum: [LOW, MEDIUM, HIGH] }
        evidenceIds:
          type: array
          items: { type: string, format: uuid }
    ActionContract:
      allOf:
        - $ref: "#/components/schemas/ActionDraft"
        - type: object
          required: [version, digest]
          properties:
            version: { type: string, enum: [action-v1] }
            digest: { type: string }
    CreatedActionPlan:
      type: object
      required: [eventId, contract, summary]
      properties:
        eventId: { type: string, format: uuid }
        contract: { $ref: "#/components/schemas/ActionContract" }
        summary: { type: string }
    HealthStatus:
      type: object
      required:
        - status
        - checkedAt
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: Overall health of the service.
        dependencies:
          type: object
          additionalProperties:
            type: string
            enum: [ok, unavailable]
          description: Per-dependency status, present on readiness responses.
        checkedAt:
          type: string
          format: date-time
          description: RFC 3339 timestamp when the check ran.
    Operator:
      type: object
      required: [id, email, name, createdAt, lastLogin]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastLogin:
          type: string
          format: date-time
    CredentialMetadata:
      type: object
      required: [id, kind, scope, fingerprint, createdBy, createdAt, updatedAt]
      description: Metadata about a stored credential. Never contains the value.
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [kubernetes, prometheus, github, openai]
        scope:
          type: string
          enum: [read, sandbox, production]
        fingerprint:
          type: string
          description: Non-reversible identifier of the secret value.
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PutCredentialRequest:
      type: object
      required: [kind, scope, value]
      properties:
        kind:
          type: string
          enum: [kubernetes, prometheus, github, openai]
        scope:
          type: string
          enum: [read, sandbox, production]
        value:
          type: string
          description: Write-only secret value; never returned by any endpoint.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ValidationError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
          description: Field name to actionable message.
    ServiceInput:
      type: object
      required: [key, displayName, environment, k8sCluster, k8sNamespace, k8sWorkload]
      properties:
        key:
          type: string
          description: Stable slug identifier (e.g. checkout-api).
        displayName:
          type: string
        environment:
          type: string
          description: Explicit environment slug (e.g. production).
        k8sCluster:
          type: string
        k8sNamespace:
          type: string
        k8sWorkload:
          type: string
        prometheusLabels:
          type: object
          additionalProperties:
            type: string
        githubRepo:
          type: string
          description: owner/repo (optional).
        githubRef:
          type: string
        recoveryPolicyRef:
          type: string
    Service:
      allOf:
        - $ref: "#/components/schemas/ServiceInput"
        - type: object
          required: [id, enabled, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            enabled:
              type: boolean
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    IncidentState:
      type: string
      enum:
        - RECEIVED
        - INVESTIGATING
        - PLANNING
        - VALIDATING
        - AWAITING_APPROVAL
        - REMEDIATING
        - VERIFYING
        - RECOVERED
        - ESCALATED
        - DENIED
        - FAILED
        - CLOSED
    Incident:
      type: object
      required:
        [id, serviceKey, environment, state, version, correlationId, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        serviceKey:
          type: string
        environment:
          type: string
        alertIdentity:
          type: string
        summary:
          type: string
        symptoms:
          type: object
          additionalProperties:
            type: string
        state:
          $ref: "#/components/schemas/IncidentState"
        version:
          type: integer
          format: int64
        correlationId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
