openapi: 3.1.0
info:
  title: Knull Incident API
  version: 0.1.0
  description: >
    HTTP contract for the Knull incident API. This foundation slice defines the
    health endpoints; incident, service, and approval operations are added by
    later implementation tasks. The TypeScript client types are generated from
    this document.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /healthz:
    get:
      operationId: getLiveness
      summary: Liveness probe
      description: Reports that the process is running. Does not check dependencies.
      responses:
        "200":
          description: Process is live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: >
        Checks every backing dependency. Returns 200 when all are reachable and
        503 with per-dependency detail otherwise.
      responses:
        "200":
          description: All dependencies reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: One or more dependencies unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /api/auth/login:
    get:
      operationId: login
      summary: Begin operator sign-in
      description: Redirects the browser to the configured OIDC provider.
      responses:
        "302":
          description: Redirect to the identity provider.
  /api/auth/logout:
    post:
      operationId: logout
      summary: Sign out
      description: Revokes the current session and clears the cookie.
      responses:
        "204":
          description: Signed out.
  /api/me:
    get:
      operationId: getMe
      summary: Current operator identity
      responses:
        "200":
          description: The signed-in operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operator"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/integrations/credentials:
    get:
      operationId: listCredentials
      summary: List integration credential metadata
      description: Returns metadata only; secret values are never included.
      responses:
        "200":
          description: Stored credential metadata.
          content:
            application/json:
              schema:
                type: object
                required: [credentials]
                properties:
                  credentials:
                    type: array
                    items:
                      $ref: "#/components/schemas/CredentialMetadata"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: putCredential
      summary: Store or replace an integration credential
      description: >
        Accepts a write-only secret value, encrypts it at rest, and returns
        metadata only. The value is never returned by any endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutCredentialRequest"
      responses:
        "200":
          description: Stored credential metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialMetadata"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/services:
    get:
      operationId: listServices
      summary: List configured services
      responses:
        "200":
          description: All configured services.
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items:
                      $ref: "#/components/schemas/Service"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createService
      summary: Create a service mapping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: Created service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "409":
          description: Duplicate key in this environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/services/{id}:
    get:
      operationId: getService
      summary: Get a service
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200":
          description: The service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "404":
          description: Not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: updateService
      summary: Update a service mapping
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "200":
          description: Updated service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "409":
          description: Duplicate key in this environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/services/{id}/enabled:
    patch:
      operationId: setServiceEnabled
      summary: Enable or disable a service
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: Updated service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "404":
          description: Not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    ServiceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    HealthStatus:
      type: object
      required:
        - status
        - checkedAt
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: Overall health of the service.
        dependencies:
          type: object
          additionalProperties:
            type: string
            enum: [ok, unavailable]
          description: Per-dependency status, present on readiness responses.
        checkedAt:
          type: string
          format: date-time
          description: RFC 3339 timestamp when the check ran.
    Operator:
      type: object
      required: [id, email, name, createdAt, lastLogin]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastLogin:
          type: string
          format: date-time
    CredentialMetadata:
      type: object
      required: [id, kind, scope, fingerprint, createdBy, createdAt, updatedAt]
      description: Metadata about a stored credential. Never contains the value.
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [kubernetes, prometheus, github, openai]
        scope:
          type: string
          enum: [read, sandbox, production]
        fingerprint:
          type: string
          description: Non-reversible identifier of the secret value.
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PutCredentialRequest:
      type: object
      required: [kind, scope, value]
      properties:
        kind:
          type: string
          enum: [kubernetes, prometheus, github, openai]
        scope:
          type: string
          enum: [read, sandbox, production]
        value:
          type: string
          description: Write-only secret value; never returned by any endpoint.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ValidationError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
          description: Field name to actionable message.
    ServiceInput:
      type: object
      required: [key, displayName, environment, k8sCluster, k8sNamespace, k8sWorkload]
      properties:
        key:
          type: string
          description: Stable slug identifier (e.g. checkout-api).
        displayName:
          type: string
        environment:
          type: string
          description: Explicit environment slug (e.g. production).
        k8sCluster:
          type: string
        k8sNamespace:
          type: string
        k8sWorkload:
          type: string
        prometheusLabels:
          type: object
          additionalProperties:
            type: string
        githubRepo:
          type: string
          description: owner/repo (optional).
        githubRef:
          type: string
        recoveryPolicyRef:
          type: string
    Service:
      allOf:
        - $ref: "#/components/schemas/ServiceInput"
        - type: object
          required: [id, enabled, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            enabled:
              type: boolean
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
