# Strict CNI mode starts all pods denied, including EKS system add-ons. Keep
# kube-system functional while each knull-run-* namespace retains default deny.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-system-addons
  namespace: kube-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {}
  egress:
    - {}
